name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require a Trusted Publishing-compatible npm
        run: node -e "const [M,m]=require('node:child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number);if(M<11||(M===11&&m<5))throw new Error('npm 11.5.1 or newer is required')"
      - run: npm ci
      - run: npm run verify
      - run: npm run bench:ci
      - run: npm audit
      - run: npm run verify:release-report
      - run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: npm pack --dry-run --json

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require a Trusted Publishing-compatible npm
        run: node -e "const [M,m]=require('node:child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number);if(M<11||(M===11&&m<5))throw new Error('npm 11.5.1 or newer is required')"
      - run: npm ci
      - run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Require an explicitly publishable manifest
        run: node -e "const p=require('./package.json');if(p.private)throw new Error('package.json is still private')"
      - run: npm publish --access public --provenance
