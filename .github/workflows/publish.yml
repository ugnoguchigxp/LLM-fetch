name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.6.4
      - run: node scripts/verify-npm-version.mjs
      - run: npm ci
      - run: npm run verify
      - run: npm run bench:ci
      - run: npm audit
      - run: npm run verify:release-report
      - run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: npm pack --dry-run --json

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.6.4
      - run: node scripts/verify-npm-version.mjs
      - run: npm ci
      - run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Require an explicitly publishable manifest
        run: node -e "const p=require('./package.json');if(p.private)throw new Error('package.json is still private')"
      - name: Run the DuckDuckGo release canary
        run: npm run canary:duckduckgo
      - name: Run the Brave release canary
        run: node scripts/provider-canary.mjs brave
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      - name: Require current-commit provider canary evidence
        run: npm run verify:release-report -- --require-canaries
      - run: npm publish --access public --provenance
