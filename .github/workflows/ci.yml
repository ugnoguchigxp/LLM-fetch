name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run bench:ci
        if: matrix.node == 24
      - run: npm run verify:release-report
      - run: npm audit --omit=dev

  bun:
    name: Core / Bun ${{ matrix.bun }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bun: [1.3.14, 1.4.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - run: npm ci
      - run: bun --bun tsc --noEmit
      - run: bun --bun vitest run
      - run: bun run build

  packed-consumer-windows:
    name: Packed consumer / Windows / Node 22
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:package

  development-audit:
    name: Development dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit

  playwright:
    name: Chromium sandbox integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the Playwright seccomp profile
        env:
          PLAYWRIGHT_SECCOMP_SHA256: cc3e61cabda6bbc1e53e54d27ba4d55a9d3be829b6dd1a596f4a7b31b1cc7849
          PLAYWRIGHT_SECCOMP_URL: https://raw.githubusercontent.com/microsoft/playwright/26a9e470a7b3c7822084b09fb7f13902c5f37b51/utils/docker/seccomp_profile.json
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/playwright-seccomp.json" \
            "$PLAYWRIGHT_SECCOMP_URL"
          echo "$PLAYWRIGHT_SECCOMP_SHA256  $RUNNER_TEMP/playwright-seccomp.json" \
            | sha256sum --check
      - name: Run Chromium with its process sandbox
        run: |
          docker run --rm --init --ipc=host \
            --user 1001:1001 \
            --security-opt "seccomp=$RUNNER_TEMP/playwright-seccomp.json" \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env HOME=/tmp \
            --env LLM_FETCH_PLAYWRIGHT_INTEGRATION=1 \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            /bin/bash -lc \
            'npm ci && npx vitest run test/playwright/integration.test.ts'

  cargo:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: rustup default 1.90.0
      - name: Enforce source file size limit
        shell: bash
        run: |
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -ge 800 ]; then
              echo "$file has $lines lines; source files must stay below 800 lines."
              exit 1
            fi
          done < <(find src test scripts bench crates examples -type f \
            \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o \
               -name '*.mjs' -o -name '*.rs' \) -print)
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test -p tauri-plugin-llm-fetch
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Verify Cargo-only package contents
        shell: bash
        run: |
          cargo package -p tauri-plugin-llm-fetch --list > "$RUNNER_TEMP/llm-fetch-package.txt"
          if grep -E '(^|/)(node_modules|dist)/|\.(ts|tsx|mjs|cjs)$|playwright' "$RUNNER_TEMP/llm-fetch-package.txt"; then
            echo "Cargo package contains a Node/TypeScript/Playwright artifact."
            exit 1
          fi
          cargo package -p tauri-plugin-llm-fetch
      - name: Verify Cargo dependency boundary
        shell: bash
        run: |
          cargo tree -p tauri-plugin-llm-fetch > "$RUNNER_TEMP/llm-fetch-tree.txt"
          if grep -Ei 'playwright|node\.js|chromium' "$RUNNER_TEMP/llm-fetch-tree.txt"; then
            echo "Cargo dependency graph contains a browser or Node runtime."
            exit 1
          fi
